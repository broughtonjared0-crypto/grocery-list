<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Groceries</title>
<meta name="theme-color" content="#0e3b2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{var t=localStorage.getItem('grocery-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* VOICE: cheerful, tactile, quick to use one-handed in an aisle
   IDEA: a store shelf — each item is a little price-tag card with its own illustrated product
   PICTURE: the list itself, every row carrying a drawn product (jug, loaf, jar, bag…)
   COLOUR and TYPE: deep produce-crate green field, lemon support, tomato accent; Familjen Grotesk + DM Sans
   LAYOUT: one phone column, green header with store + progress, sticky add bar, bottom tabs, bottom sheets */
:root{color-scheme:light dark;
--bg:light-dark(#f6f5ef,#0a1511);--card:light-dark(#fff,#12211b);--ink:light-dark(#11251c,#e9f2ed);
--mute:light-dark(#5b6d64,#98b0a4);--line:light-dark(#e4e6dd,#21362c);--soft:light-dark(#eef1e8,#18291f);
--green:light-dark(#0e3b2c,#0d2a1f);--lemon:#ffd23f;--tomato:#ff5436;--leaf:#2f9e6b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,.row,.v,.loc,nav.tabs{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
h1,h2,h3{font-family:"Familjen Grotesk",sans-serif;margin:0;line-height:1.05;text-wrap:balance}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.top{background:var(--green);color:#f3fbf6;padding:calc(18px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.top>*{position:relative}.top svg.deco{position:absolute;right:-24px;top:-28px;width:150px;opacity:.13;pointer-events:none}
.top h1{font-size:40px}
.storeBtn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:var(--lemon);color:#1d1a05;font-weight:700;padding:9px 14px;border-radius:999px;min-height:44px}
.storeBtn small{font-weight:500;opacity:.7}
.prog{margin-top:16px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lemon);border-radius:99px;transition:width .4s}
.prog b{font-size:15px;white-space:nowrap}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;border-radius:999px;font-weight:700;font-size:15px}
.pill svg{width:18px;height:18px}
.p-light{background:rgba(255,255,255,.12);color:#fff}
.p-tom{background:var(--tomato);color:#fff}
.p-green{background:var(--green);color:#fff}
.p-soft{background:var(--soft);color:var(--ink)}
.p-lemon{background:var(--lemon);color:#1d1a05}
.addbar{position:sticky;top:0;z-index:5;padding:12px 14px;background:linear-gradient(var(--bg) 80%,transparent)}
.addrow{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 6px 18px rgba(10,40,25,.07)}
.addrow input{flex:1;border:0;background:none;padding:8px 10px;outline:none}
.addrow button{min-width:44px;min-height:44px;border-radius:13px;background:var(--tomato);color:#fff;font-weight:700;padding:0 14px}
.sugs{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 0;scrollbar-width:none}
.sugs button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;min-height:36px}
main{padding:0 14px}
.sec{margin:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:20px}
.sec span{color:var(--mute);font-size:14px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) 40px 44px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 8px;margin-bottom:8px;transition:opacity .25s}
.row .art{width:56px;height:56px}
.row .body{text-align:left;padding:2px 0;min-height:44px}
.row .nm{font-weight:700;font-size:16.5px;line-height:1.25;overflow-wrap:anywhere}
.row .sub{font-size:13.5px;color:var(--mute);line-height:1.3;margin-top:2px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap}
.tag.pick{background:color-mix(in srgb,var(--leaf) 18%,transparent);color:var(--leaf)}
.tag.star{background:color-mix(in srgb,var(--tomato) 16%,transparent);color:var(--tomato)}
.rm{width:40px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mute)}.rm svg{width:20px;height:20px}.rm:hover,.rm:active{color:var(--tomato);background:color-mix(in srgb,var(--tomato) 10%,transparent)}
.chk{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center}
.chk svg{width:22px;height:22px;opacity:0}
.row.done{opacity:.6}.row.done .nm{text-decoration:line-through;text-decoration-thickness:2px}
.row.done .chk{background:var(--leaf);border-color:var(--leaf);color:#fff}.row.done .chk svg{opacity:1}
.row.done .chk{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.banner{background:color-mix(in srgb,var(--lemon) 30%,var(--card));border-radius:18px;padding:14px 16px;margin-top:14px;display:grid;gap:10px}
.banner p{margin:0}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}
.empty .art{width:110px;height:110px;margin:0 auto 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.mini{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.mini .art{width:44px;height:44px}
.mini .nm{font-weight:700;line-height:1.25}.mini .sub{font-size:13px;color:var(--mute);line-height:1.3}
.plus{min-width:44px;min-height:44px;border-radius:14px;background:var(--soft);font-weight:700;padding:0 12px;white-space:nowrap;font-size:14px}
.plus.on{color:var(--leaf)}
.strip{display:flex;gap:2px;margin-top:8px;overflow:hidden}.strip .art{width:30px;height:30px;flex:none}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;min-height:48px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-height:38px;font-size:14px}
.chips button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
details.cat{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:10px;padding:4px 14px}
details.cat summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;cursor:pointer;font-weight:700}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary .art{width:34px;height:34px}
details.cat summary span{margin-left:auto;color:var(--mute);font-weight:500;font-size:14px}
.note{font-size:13px;color:var(--mute)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{min-height:62px;display:grid;place-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--mute);padding:6px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--tomato)}
.scrim{position:fixed;inset:0;background:rgba(5,20,12,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:10px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:24px;margin-bottom:4px}
.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:14px;font-weight:700}
.field input,.field select{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 12px;min-height:48px;width:100%}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.step{display:flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:48px}
.step button{width:48px;height:46px;font-size:22px}.step b{flex:1;text-align:center}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.v{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px;text-align:left;display:grid;gap:6px;align-content:start}
.v .art{width:64px;height:64px}
.v .nm{font-weight:700;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.v .sub{font-size:13px;color:var(--mute)}
.v[aria-pressed=true]{border-color:var(--leaf);box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 25%,transparent)}
.skel{height:150px;border-radius:18px;background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.err{background:color-mix(in srgb,var(--tomato) 12%,var(--card));border-radius:14px;padding:12px;font-size:14.5px;margin-top:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btnrow .pill{flex:1;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#10261c;color:#fff;border-radius:16px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;z-index:40;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 24px);font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--lemon);font-weight:700;min-height:40px;padding:0 10px}
.toast.undo{background:none;padding:0}
.toast.undo #tmsg{display:none}
.toast.undo button{background:var(--lemon);color:#1d1a05;font-size:17px;min-height:50px;padding:0 34px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.sync{font-size:12.5px;opacity:.75;margin-top:4px}
a.link{color:var(--leaf);font-weight:700}
.art.ph{display:block;background:#fff;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(10,40,25,.08)}
.art.ph img{display:block;width:100%;height:100%;object-fit:contain}
.v .art{width:100%;height:auto;aspect-ratio:1}
.v .brand{font-size:12.5px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;line-height:1.2}
.price{font-weight:700;font-size:15px}.price s{color:var(--mute);font-weight:500;font-size:13px;margin-left:4px}.price .sale{color:var(--tomato)}
.gear{position:absolute!important;z-index:2;right:12px;top:calc(12px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#f3fbf6;background:rgba(255,255,255,.12)}.gear svg{width:22px;height:22px}
.locs{display:grid;gap:8px;margin-top:10px}
.loc{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;min-height:52px}
a.pill{text-decoration:none}
.loc b{display:block;line-height:1.25}.loc span{font-size:13px;color:var(--mute)}
.loc[aria-pressed=true]{border-color:var(--leaf);box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 25%,transparent)}
.zipf{display:flex;gap:8px;margin-top:12px}.zipf input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 12px;min-height:48px}
.list-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.v{position:relative;padding:0}
.v .vb{display:grid;gap:6px;align-content:start;text-align:left;width:100%;height:100%;padding:10px;border-radius:16px}
.v.on{border-color:var(--leaf);box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 25%,transparent)}
.fav{position:absolute;top:6px;right:6px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 90%,transparent);color:var(--mute);box-shadow:0 1px 5px rgba(0,0,0,.14)}
.fav svg,.plus svg{width:22px;height:22px;vertical-align:middle}
.fav[aria-pressed=true],.plus[aria-pressed=true]{color:#d9a400}
.tag.favtag{background:color-mix(in srgb,var(--lemon) 38%,transparent);color:var(--ink)}
.mbtns{display:flex;gap:6px}
.sheet h4{font-family:"Familjen Grotesk",sans-serif;font-size:18px;margin:18px 0 4px}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <div id="view"></div>
</div>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tundo">Undo</button></div>

<script>
{
// The Cloudflare Worker that talks to Kroger (no keys live in this page).
const API_DEFAULT = 'https://groceries-api.groceries-api.workers.dev';
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const key = n => String(n).toLowerCase().replace(/\s+/g,' ').trim();
const today = () => new Date().toISOString().slice(0,10);
const fmtD = d => d ? new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';

/* ---------- categories ---------- */
const CATS = [
 ['produce','Produce',/green onion|onion|banana|apple|lettuce|tomato|potato|lemon|strawberr|grape(?! jelly)|avocado|carrot/],
 ['frozen','Frozen',/frozen|french bread pizza|pizza|fries|tv dinner|texas toast|meatball|hash brown|ice cream/],
 ['meat','Meat & deli',/chicken|bacon|beef|turkey|sausage|ham\b|hot dog|pepperoni/],
 ['breakfast','Breakfast',/breakfast|pancake|poptart|pop-tart|donut|cereal|syrup|waffle|muffin/],
 ['dairy','Dairy & eggs',/milk|butter(?!.*peanut)|cheese|cheddar|parmesan|mozzarella|yogurt|cream|egg/],
 ['bakery','Bakery & bread',/bread|nan\b|naan|tortilla|bagel|roll/],
 ['snacks','Snacks',/chip|dorito|popcorn|pocky|cookie|cracker|candy|pretzel/],
 ['drinks','Drinks',/tea\b|tea bag|coffee|soda|juice|water|drink/],
 ['condiments','Sauces & spreads',/ranch|ketchup|mustard|mayo|salsa|bbq|dip|jelly|nutella|peanut butter|sauce/],
 ['pantry','Pantry',/pasta|spaghetti|canned|mac and cheese|ramen|sugar|rice|flour|pepper|salt|seasoning|soup|bean/],
 ['household','Household',/paper towel|trash|wipe|scrubber|cup|container|dish|foil|bag|plate|soap(?!.*body)|napkin/],
 ['personal','Personal care',/body wash|toothpaste|toothbrush|shampoo|deodorant|floss|lotion/],
 ['other','Other',/$^/]
];
const CATN = Object.fromEntries(CATS.map(c=>[c[0],c[1]]));
const guessCat = t => { t=key(t); if(/cracked pepper|black pepper/.test(t)) return 'pantry'; if(/pasta sauce/.test(t)) return 'condiments'; if(/chips|chocolate|candy|cookies|crackers/.test(t)) return 'snacks'; if(/juice|soda|lemonade|creamer/.test(t)) return /creamer/.test(t)?'dairy':'drinks'; if(/dog food|cat food|litter|dog treats/.test(t)) return 'household'; for(const c of CATS) if(c[2].test(t)) return c[0]; return 'other'; };

/* ---------- illustrations ---------- */
const GLY = [
 [/milk/,'jug'],[/bread|texas toast|loaf/,'loaf'],[/muffin/,'muffin'],[/donut|breakfast/,'donut'],[/pancake|poptart|cereal|tv dinner|mac and cheese|spaghetti|pasta(?! sauce)|tea bag|tea\b/,'box'],
 [/pizza/,'pizza'],[/canned|soup|bean/,'can'],[/ranch|body wash|syrup|ketchup|bbq|dish soap|shampoo|parmesan/,'bottle'],
 [/peanut butter|nutella|sauce|jelly|salsa|pepper/,'jar'],[/chip|dorito|fries|popcorn|sugar|rice|hash/,'bag'],[/paper towel/,'roll'],
 [/cheese|cheddar|mozzarella/,'wedge'],[/chicken|turkey/,'drum'],[/bacon/,'bacon'],[/cup|ramen/,'cup'],[/toothpaste/,'tube'],
 [/onion|scallion/,'stalk'],[/trash can/,'bin'],[/scrubber|sponge/,'sponge'],[/wipe/,'canister'],[/tortilla|nan\b|naan/,'flat'],
 [/meatball/,'balls'],[/butter/,'stick'],[/pocky/,'sticks'],[/container|gallon/,'jug2'],[/egg/,'eggs']
];
const CATG = {produce:'stalk',frozen:'box',meat:'drum',breakfast:'donut',dairy:'jug',bakery:'loaf',snacks:'bag',drinks:'bottle',condiments:'jar',pantry:'can',household:'roll',personal:'tube',other:'bag'};
const HUES = ['#ff5436','#2f7de1','#2f9e6b','#f28c28','#d63f7c','#ffb703','#0fa3b1','#e24e1b'];
const hash = s => { let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); };
const TINT = {produce:'#dff3e4',frozen:'#dcecfb',meat:'#fde2dc',breakfast:'#fff0c7',dairy:'#e3eefc',bakery:'#f8e8d3',snacks:'#ffe7cc',drinks:'#dff4f2',condiments:'#fbe4ee',pantry:'#efe9dc',household:'#e6ecef',personal:'#efe4fb',other:'#ececec'};
function art(name, cat){
  const t = key(name); let g = CATG[cat] || 'bag';
  for (const [r,n] of GLY) if (r.test(t)) { g=n; break; }
  const a = HUES[hash(t)%HUES.length], d='#1b2a22', w='#ffffff';
  const S = {
   jug:`<path d="M20 22h20l4 8v20a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V30z" fill="${w}" stroke="${d}" stroke-width="2"/><path d="M44 30h4a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-4" fill="none" stroke="${d}" stroke-width="2.5"/><rect x="23" y="15" width="14" height="7" rx="2" fill="${/whole/.test(t)?'#e5383b':a}"/><rect x="16" y="36" width="28" height="10" fill="${/whole/.test(t)?'#e5383b':a}"/>`,
   jug2:`<path d="M18 22h24l3 8v20a4 4 0 0 1-4 4H19a4 4 0 0 1-4-4V30z" fill="#e9f6ff" stroke="${d}" stroke-width="2"/><rect x="24" y="15" width="12" height="7" rx="2" fill="${a}"/><path d="M15 40h30" stroke="${a}" stroke-width="3"/>`,

const curLoc = () => S.loc&&chainName(S.loc.chain)===S.store ? S.loc : null;
const locLabel = l => !l ? '' : (/ - /.test(l.name)?l.name.split(' - ').slice(1).join(' - '):(l.address||'').split(',').slice(-2,-1)[0]||l.name||'').trim();
async function ensureLoc(){
  const have=curLoc(); if(have) return have;
  let list=S.locCache&&S.locCache.zip===S.zip?S.locCache.list:null;
  if(!list){ list=await api('/stores',{zip:S.zip}); S.locCache={zip:S.zip,list}; }
  const l=list.find(x=>chainName(x.chain)===S.store)||(S.store==='Kroger'?list[0]:null);
  if(!l) throw new Error(`No ${S.store} stores near ${S.zip}. Tap the store button to pick another.`);
  S.loc=l; S.store=chainName(l.chain); save(); renderTop(); return l;
}

const choiceFor = n => { const c=S.cat[key(n)]; return c&&(c.choices&&c.choices[S.store]||c.favs&&c.favs[S.store]&&c.favs[S.store][0])||null; };

function photoFor(name){ const c=S.cat[key(name)]; if(!c) return ''; if(c.photo) return c.photo; const ch=c.choices&&c.choices[S.store]||c.favs&&c.favs[S.store]&&c.favs[S.store][0]; return ch&&ch.image?imgSrc(ch.image):''; }
function thumb(name, cat, src, style){
  if(src===undefined) src=photoFor(name);
  const st=style?` style="${style}"`:'';
  if(!src) return art(name,cat).replace('class="art"',`class="art"${st}`);
  return `<span class="art ph" data-n="${esc(name)}" data-c="${esc(cat)}"${st}><img loading="lazy" alt="" src="${esc(src)}" onerror="__artFail(this)"></span>`;
}
window.__artFail = img => { const s=img.parentNode; if(!s||!s.dataset) return; const st=s.getAttribute('style'); s.outerHTML=art(s.dataset.n,s.dataset.c).replace('class="art"',`class="art"${st?` style="${esc(st)}"`:''}`); };
function readPhoto(file){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const n=256, side=Math.min(img.naturalWidth,img.naturalHeight); if(!side){ URL.revokeObjectURL(url); rej(); return; }
      const c=document.createElement('canvas'); c.width=c.height=n; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,n,n);
      g.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,n,n);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.8)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    img.src=url; });
}

const onList = n => S.list.some(i=>key(i.name)===key(n));
function addItem(name, extra={}){
  name=String(name).trim(); if(!name) return;
  const ex=S.list.find(i=>key(i.name)===key(name));
  if(ex){ if(ex.done){ex.done=false;} else ex.qty=(ex.qty||1)+1; useFavorite(S.cat[key(ex.name)]); save(); render(); toast(`${name} is on your list`); return; }
  const c=S.cat[key(name)];
  const it=mk(c?c.name:name, extra.note ?? (c?c.note:''), extra.store ?? (c?c.store:''), false, 1, false);
  if(extra.cat||c) it.cat=extra.cat||c.cat;
  S.list.unshift(it); applyDefaultPick(ensureCat(it)); save(); render(); toast(`Added ${it.name}`);
}
let undoSnap=null, tt=null;
function toast(msg, undo){
  $('#tmsg').textContent=msg; $('#tundo').style.display=undo?'':'none'; undoSnap=undo||null;
  $('#toast').classList.toggle('undo',!!undo); $('#tundo').setAttribute('aria-label',undo?'Undo: '+msg:'Undo');
  $('#toast').classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>$('#toast').classList.remove('on'),undo?5000:2200);
}
$('#tundo').onclick=()=>{ if(undoSnap){ S=JSON.parse(undoSnap); save(); render(); } $('#toast').classList.remove('on'); };
const snap = () => JSON.stringify(S);
function listText(){
  const todo=S.list.filter(i=>!i.done); if(!todo.length) return '';
  const out=[];
  CATS.forEach(([k,label])=>{ const g=todo.filter(i=>i.cat===k); if(!g.length) return;
    out.push(label); g.forEach(i=>{ const c=choiceOf(i); const extra=c?c.name:i.note; out.push(`- ${i.name}${i.qty>1?' ×'+i.qty:''}${extra?' — '+extra:''}${i.store&&i.store!==S.store?' ('+i.store+')':''}`); }); out.push(''); });
  return `Groceries — ${S.store}\n\n`+out.join('\n').trim();
}
async function copyList(){
  const t=listText(); if(!t){ toast('Nothing left to copy — everything’s in the cart'); return; }
  let ok=false; try{ await navigator.clipboard.writeText(t); ok=true; }catch(e){}
  if(!ok){ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try{ ok=document.execCommand('copy') }catch(e){} ta.remove(); }
  toast(ok?`Copied ${S.list.filter(i=>!i.done).length} items`:'Couldn’t copy on this browser');
}

let SALE=null, saleState='', saleBusy=false;
function pairings(){
  const base = S.list.length ? S.list : (S.trips[0]?.items||[]);
  const names=S.list.map(i=>key(i.name)), out=[], seen=new Set();
  base.forEach(b=>PAIRS.forEach(([r,arr])=>{ if(r.test(key(b.name))) arr.forEach(s=>{ const k=key(s), w=k.split(' ')[0];
    if(seen.has(k)||names.some(n=>n.includes(w)&&w.length>3)||onList(s)) return; seen.add(k); out.push({name:s,why:'Goes with '+b.name}); }); }));
  return out.slice(0,12);
}

   ${SALE&&SALE.length?SALE.map(saleRow).join(''):SALE&&!saleState?'<p class="note">None of your usuals are on sale right now.</p>':''}
   ${saleState?`<div class="${saleBusy?'note':'err'}">${esc(saleState)}</div>`:''}
   <div class="btnrow">${onKroger()?`<button class="pill p-green" data-act="sales" ${saleBusy?'disabled':''}>${IC.tag} ${saleBusy?'Checking…':SALE?'Check again':'Check sales'}</button>`:'<button class="pill p-soft" data-act="store">Choose a Kroger store</button>'}</div></div></main>`;
  $('#view').innerHTML=h;

async function runSales(){
  if(saleBusy) return;
  let loc; try{ loc=await ensureLoc(); }catch(e){ saleState=e.message; renderIdeas(); return; }
  const usual=Object.values(S.cat).filter(c=>c.count>0).sort((a,b)=>b.count-a.count);
  const pool=(usual.length?usual:S.list.map(i=>S.cat[key(i.name)]).filter(Boolean)).slice(0,12);
  if(!pool.length){ saleState='Add a few items or finish a trip first.'; renderIdeas(); return; }
  saleBusy=true; saleState=`Checking ${pool.length} of your usuals…`; if(tab==='ideas') renderIdeas();
  const out=[]; let fails=0;
  for(let i=0;i<pool.length;i+=3) await Promise.all(pool.slice(i,i+3).map(async c=>{
    try{ const r=await api('/search',{q:searchQuery(c.name,c.note),locationId:loc.locationId,limit:10});
      const mine=c.choices&&c.choices[S.store], hit=mine&&r.find(x=>x.productId===String(mine.id));
      const p=hit&&hit.promo?hit:r.slice(0,5).find(x=>x.promo&&x.price);
      if(p) out.push({item:c.name,cat:c.cat,p}); }catch(e){ fails++; } }));
  saleBusy=false;
  if(fails===pool.length){ SALE=null; saleState='Couldn’t reach Kroger just now. Try again in a moment.'; }
  else { SALE=out.sort((a,b)=>(b.p.price-b.p.promo)-(a.p.price-a.p.promo)); saleState=''; }
  if(tab==='ideas') renderIdeas();
}

function saveTrip(got){

  if(got.length) saveTrip(got);
  S.list=[]; save(); closeSheet(); render();
  toast(`Cleared ${n} items${got.length?` · ${got.length} saved to History`:''}`, before);
}
const resetSearches = () => { SALE=null; saleState=''; CR=null; crState=''; };
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, it=b.dataset.id&&S.list.find(i=>i.id===b.dataset.id);
  if(a==='tick'&&it){ it.done=!it.done; save(); render(); }
  else if(a==='edit'&&it) editSheet(it);
  else if(a==='variants'&&it) variantSheet(it);
  else if(a==='pick'&&it){ const x=VR[+b.dataset.i]; if(!x) return; const c=ensureCat(it); c.choices=c.choices||{}; c.choices[S.store]=pickOf(x); const fa=c.favs&&c.favs[S.store]; if(fa){ const k=fa.findIndex(f=>String(f.id)===String(x.productId)); if(k>0) fa.unshift(fa.splice(k,1)[0]); } save(); closeSheet(); render(); toast('Picked for '+S.store); }
  else if(a==='unpick'&&it){ const c=ensureCat(it); if(c.choices) delete c.choices[S.store]; save(); closeSheet(); render(); }
  else if(a==='photo'&&it){ const f=$('#phf'); if(f){ f.value=''; f.click(); } }
  else if(a==='rmphoto'&&it){ const c=ensureCat(it); delete c.photo; save(); render(); editSheet(it); toast('Photo removed'); }
  else if(a==='del'&&it){ const before=snap(); S.list=S.list.filter(i=>i!==it); save(); closeSheet(); render(); toast(`Removed ${it.name} — still in your Catalog`, before); }
  else if(a==='quick') addItem(b.dataset.n);
  else if(a==='krogeradd'){ addItem(b.dataset.n); const ni=S.list.find(i=>key(i.name)===key(b.dataset.n)); if(ni) variantSheet(ni); }
  else if(a==='addpick'){ const x=CR&&CR[+b.dataset.i]; if(!x) return; const nm=generalName(x,cq); const c=catFor(nm,guessCat(nm)); const pk=pickOf(x); if(onList(c.name)){ c.choices[S.store]=pk; save(); render(); toast(`${c.name}: ${x.name}`); } else { addItem(c.name,{cat:c.cat}); c.choices[S.store]=pk; save(); render(); } }
  else if(a==='catfav'){ const x=CR&&CR[+b.dataset.i]; if(!x) return; const nm=generalName(x,cq); const c=catFor(nm,guessCat(nm)); const on=toggleFav(c,pickOf(x),false); save(); renderCatalog(); toast(on?`★ Saved to ${c.name} favorites (${CATN[c.cat]})`:`Removed from ${c.name} favorites`); }
  else if(a==='fav'&&it){ const x=VR[+b.dataset.i]; if(!x) return; const on=toggleFav(ensureCat(it),pickOf(x)); save(); render(); if(VREDRAW) VREDRAW(); toast(on?`★ Saved to ${it.name} favorites`:`Removed from ${it.name} favorites`); }
  else if(a==='saleadd'){ const x=SALE&&SALE[+b.dataset.i]; if(!x) return; addItem(x.item); const c=S.cat[key(x.item)]; if(c){ c.choices=c.choices||{}; if(!c.choices[S.store]) c.choices[S.store]=pickOf(x.p); save(); render(); } }
  else if(a==='sales') runSales();
  else if(a==='favsheet') favSheet(b.dataset.k);
  else if(a==='cadd'){ const x=FR[+b.dataset.i], c=S.cat[b.dataset.k]; if(!x||!c) return; const pk=pickOf(x);
    if(onList(c.name)){ const li=S.list.find(i=>key(i.name)===key(c.name)); if(li) li.done=false; c.choices=c.choices||{}; c.choices[S.store]=pk; save(); closeSheet(); render(); toast(`${c.name} on your list: ${x.name}`); }
    else { addItem(c.name,{cat:c.cat}); c.choices=c.choices||{}; c.choices[S.store]=pk; save(); closeSheet(); render(); toast(`Added ${c.name}: ${x.name}`); } }
  else if(a==='catdel'){ const c=S.cat[b.dataset.k]; if(!c) return; const before=snap(); delete S.cat[b.dataset.k]; save(); closeSheet(); render(); toast(`Removed ${c.name} from your Catalog`, before); }
  else if(a==='cfav'){ const x=FR[+b.dataset.i], c=S.cat[b.dataset.k]; if(!x||!c) return; const on=toggleFav(c,pickOf(x),false); save(); if(FREDRAW) FREDRAW(); if(tab==='catalog') renderCatalog(); toast(on?`★ Saved to ${c.name} favorites`:`Removed from ${c.name} favorites`); }
  else if(a==='store') storeSheet();
  else if(a==='setloc'){ const l=S.locCache&&S.locCache.list[+b.dataset.i]; if(!l) return; S.loc=l; S.store=chainName(l.chain); resetSearches(); save(); closeSheet(); render(); toast(`Shopping at ${S.store} · ${locLabel(l)}`); }
  else if(a==='setstore'){ S.store=b.dataset.s; resetSearches(); save(); closeSheet(); render(); toast('Shopping at '+S.store); }
  else if(a==='copy') copyList();
  else if(a==='settings') settingsSheet();
  else if(a==='copycode'){ (navigator.clipboard?navigator.clipboard.writeText(fmtCode(SYNC)):Promise.reject()).then(()=>toast('Sync code copied'),()=>toast('Code: '+fmtCode(SYNC))); }
  else if(a==='nobanner'){ try{localStorage.setItem('grocery-nobanner','1')}catch(e){} render(); }
  else if(a==='export') exportJSON();
  else if(a==='import'){ const f=$('#impf'); if(f){ f.value=''; f.click(); } }
  else if(a==='theme'){ const t=b.dataset.th; if(t==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t; try{ t==='auto'?localStorage.removeItem('grocery-theme'):localStorage.setItem('grocery-theme',t) }catch(e){} settingsSheet(); }
  else if(a==='close') closeSheet();
  else if(a==='finish') finishTrip();
  else if(a==='clear') clearSheet();
  else if(a==='doclear') clearList();
  else if(a==='restock'){ const t=S.trips[0]; if(!t){ toast('No past trips yet'); return; } t.items.forEach(i=>{ if(!onList(i.name)){ const n=mk(i.name,i.note||'','',false,1,false); n.cat=i.cat; const c=S.cat[key(i.name)]; if(c){n.store=c.store||'';} applyDefaultPick(c); S.list.push(n);} }); save(); render(); toast(`Added ${t.items.length} items from ${fmtD(t.date)}`); }
  else if(a==='readd'){ const t=S.trips.find(x=>x.id===b.dataset.id); if(t){ let n=0; t.items.forEach(i=>{ if(!onList(i.name)){ const x=mk(i.name,i.note||'','',false,1,false); x.cat=i.cat; applyDefaultPick(S.cat[key(i.name)]); S.list.push(x); n++; } }); save(); render(); toast(`Added ${n} items`); } }
  else if(a==='tab'){ tab=b.dataset.t; render(); scrollTo(0,0); }
  else if(a==='cf'){ cfilter=b.dataset.c; renderCatalog(); }
});

/* ---------- sync: one copy online, so every device and the Home Screen app match ---------- */
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>ALPH[x%ALPH.length]).join('');
const fmtCode=c=>String(c||'').replace(/(.{4})(?=.)/g,'$1-');
let SYNC=null; try{ SYNC=localStorage.getItem('grocery-sync') }catch(e){}
if(!SYNC){ SYNC=newCode(); try{ localStorage.setItem('grocery-sync',SYNC) }catch(e){} }
const syncOn=()=>!/REPLACE_ME/.test(API)&&!!SYNC;
let pushT=null, pushing=false, pushAgain=false, dirty=false;
function schedulePush(){ if(!syncOn()) return; dirty=true; clearTimeout(pushT); pushT=setTimeout(push,1200); }
async function push(){
  if(pushing){ pushAgain=true; return; } pushing=true;
  try{ const r=await fetch(API+'/sync/'+SYNC,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({at:S._at||Date.now(),data:S})});
    if(!r.ok){ let j=null; try{j=await r.json()}catch(e){} throw new Error(j&&j.error||'sync failed'); }
    dirty=false; setSync('Saved and synced'); }
  catch(e){ setSync(navigator.onLine===false?'Saved on this device · syncs when you’re back online':'Saved on this device · couldn’t sync just now'); }
  pushing=false; if(pushAgain){ pushAgain=false; push(); }
}
function adopt(remote){
  S=normalize(remote.data); S._at=remote.at;
  try{ localStorage.setItem('grocery-v1',JSON.stringify(S)) }catch(e){}
  resetSearches(); render();
}
async function pull(){
  if(!syncOn()) return;
  try{ const r=await fetch(API+'/sync/'+SYNC,{cache:'no-store'});
    if(r.status===404){ schedulePush(); return; }
    if(!r.ok) return;
    const remote=await r.json();
    if(remote&&remote.data&&(remote.at||0)>(S._at||0)&&!dirty){ adopt(remote); setSync('Saved and synced'); }
    else if((S._at||0)>(remote.at||0)) schedulePush();
    else setSync('Saved and synced');
  }catch(e){}
}
async function linkCode(raw){
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==12){ toast('Sync codes are 12 letters and numbers'); return; }
  if(code===SYNC){ toast('This device already uses that code'); return; }
  try{ const r=await fetch(API+'/sync/'+code,{cache:'no-store'});
    if(r.status===404){ toast('No list found for that code'); return; }
    if(!r.ok) throw 0;
    const remote=await r.json();
    if(!confirm(`Use the synced list (${remote.data.list.length} items, ${(remote.data.trips||[]).length} trips) on this device? This replaces what’s here now.`)) return;
    const before=snap(); SYNC=code; try{ localStorage.setItem('grocery-sync',code) }catch(e){}
    adopt(remote); closeSheet(); toast('Linked: this device now shares that list');
  }catch(e){ toast('Couldn’t reach sync just now. Try again in a moment.'); }
}
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function showInstall(){ if(standalone()) return false; try{ if(localStorage.getItem('grocery-nobanner')) return false }catch(e){} return /iPhone|iPad|Android/i.test(navigator.userAgent); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pull(); else if(dirty){ clearTimeout(pushT); push(); } });
addEventListener('online',()=>{ if(dirty) push(); });
if(location.hash.startsWith('#link=')){ const c=location.hash.slice(6); history.replaceState(null,'',location.pathname+location.search); setTimeout(()=>linkCode(c),300); }
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist() }catch(e){}

/* ---------- tabs + render ---------- */
const TABS=[['list','List',IC.list],['ideas','Ideas',IC.spark],['history','History',IC.clock],['catalog','Catalog',IC.book]];
function render(){
  renderTop();
  $('#tabs').innerHTML=TABS.map(t=>`<button data-act="tab" data-t="${t[0]}" ${tab===t[0]?'aria-current="page"':''}>${t[2]}${t[1]}</button>`).join('');
  ({list:renderList,ideas:renderIdeas,history:renderHistory,catalog:renderCatalog})[tab]();
}
render();
pull();
}
